# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Run `npm run config:link` after creating the app in the Shopify Dev Dashboard to
# populate client_id and application_url with real values.

name = "inventory-receiving"
handle = "inventory-receiving"
application_url = "https://example.com"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# read/write products: barcode lookup + price (margin) updates
# read/write inventory: receiving quantity adjustments
# read locations: pick the receiving location
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"
